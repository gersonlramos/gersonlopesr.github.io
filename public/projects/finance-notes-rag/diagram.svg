<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">Local-first RAG pipeline over financial statements</title>
  <desc id="desc">An offline indexing lane turns PDF statements into a ChromaDB index; an online query lane retrieves with BM25 and a year filter, then generates a cited answer with a local LLM.</desc>
  <rect x="0" y="0" width="1040" height="360" fill="#0a0e14" />

  <!-- Offline indexing lane (top row) -->
  <!-- Box 1: PDF Statements -->
  <rect x="20" y="40" width="145" height="90" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="92" y="77" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">PDF Statements</text>
  <text x="92" y="101" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Flamengo 2022-2025</text>

  <line x1="165" y1="85" x2="192" y2="85" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Box 2: Extraction -->
  <rect x="192" y="40" width="145" height="90" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="264" y="77" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Extraction</text>
  <text x="264" y="101" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">PyMuPDF4LLM + Tesseract OCR</text>

  <line x1="337" y1="85" x2="364" y2="85" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Box 3: Cleaning -->
  <rect x="364" y="40" width="145" height="90" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="436" y="77" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Cleaning</text>
  <text x="436" y="101" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">~7 rule-based transforms</text>

  <line x1="509" y1="85" x2="536" y2="85" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Box 4: Chunking -->
  <rect x="536" y="40" width="145" height="90" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="608" y="77" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Chunking</text>
  <text x="608" y="101" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">512-token windows, 64 overlap</text>

  <line x1="681" y1="85" x2="708" y2="85" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Box 5: Embedding -->
  <rect x="708" y="40" width="145" height="90" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="780" y="77" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Embedding</text>
  <text x="780" y="101" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">MiniLM multilingual (ONNX, CPU)</text>

  <line x1="853" y1="85" x2="880" y2="85" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Box 6: Index -->
  <rect x="880" y="40" width="145" height="90" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="952" y="77" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Index</text>
  <text x="952" y="101" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">ChromaDB (cosine)</text>

  <!-- Online query lane (bottom row) -->
  <!-- Box 7: User Question -->
  <rect x="20" y="230" width="145" height="90" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="92" y="267" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">User Question</text>
  <text x="92" y="291" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">natural language</text>

  <line x1="165" y1="275" x2="364" y2="275" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Box 8: Retrieval -->
  <rect x="364" y="230" width="145" height="90" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="436" y="267" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Retrieval</text>
  <text x="436" y="291" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">BM25 lexical + year filter</text>

  <!-- Index converges into Retrieval -->
  <line x1="905" y1="130" x2="500" y2="230" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />

  <line x1="509" y1="275" x2="536" y2="275" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Box 9: Generation -->
  <rect x="536" y="230" width="145" height="90" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="608" y="267" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Generation</text>
  <text x="608" y="291" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Ollama Llama 3.2 3B + citations</text>

  <line x1="681" y1="275" x2="708" y2="275" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Box 10: Cited Answer -->
  <rect x="708" y="230" width="180" height="90" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="798" y="267" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Cited Answer</text>
  <text x="798" y="291" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">grounded or abstains</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22d3ee" />
    </marker>
  </defs>
</svg>
