<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid LightGBM forecasting ensemble</title>
  <desc id="desc">A feature panel feeds a direct LightGBM and a recursive LightGBM; their predictions are combined in a learned blend, hard-zeroed for dormant series, and emitted as a 16-day forecast.</desc>
  <rect x="0" y="0" width="1200" height="340" fill="#0a0e14" />

  <!-- Box A: Feature Panel -->
  <rect x="24" y="120" width="200" height="100" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="124" y="164" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Feature Panel</text>
  <text x="124" y="188" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">recent-history features</text>

  <!-- Arrow A -> B -->
  <line x1="224" y1="150" x2="272" y2="90" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />
  <!-- Arrow A -> C -->
  <line x1="224" y1="190" x2="272" y2="250" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Box B: Direct LightGBM -->
  <rect x="280" y="30" width="210" height="90" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="385" y="70" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Direct LightGBM</text>
  <text x="385" y="93" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">5 seeds &#183; ~70% weight</text>

  <!-- Box C: Recursive LightGBM -->
  <rect x="280" y="220" width="210" height="90" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="385" y="260" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Recursive LightGBM</text>
  <text x="385" y="283" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">per-family &#183; ~30%</text>

  <!-- Arrow B -> D -->
  <line x1="490" y1="90" x2="536" y2="150" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />
  <!-- Arrow C -> D -->
  <line x1="490" y1="250" x2="536" y2="190" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Box D: Learned Blend -->
  <rect x="540" y="120" width="200" height="100" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="640" y="164" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Learned Blend</text>
  <text x="640" y="188" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">LOO-validated weights</text>

  <!-- Arrow D -> E -->
  <line x1="740" y1="170" x2="788" y2="170" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Box E: Post-process -->
  <rect x="796" y="120" width="170" height="100" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="881" y="164" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Post-process</text>
  <text x="881" y="188" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">zero dormant series</text>

  <!-- Arrow E -> F -->
  <line x1="966" y1="170" x2="1014" y2="170" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Box F: 16-day Forecast -->
  <rect x="1022" y="120" width="150" height="100" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="1097" y="164" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">16-day Forecast</text>
  <text x="1097" y="188" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">1,782 series</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22d3ee" />
    </marker>
  </defs>
</svg>
