<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 340" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid LightGBM forecasting ensemble</title>
  <desc id="desc">A feature panel feeds a direct LightGBM and a recursive LightGBM; their predictions are combined in a learned blend, hard-zeroed for dormant series, and emitted as a 16-day forecast.</desc>
  <rect x="0" y="0" width="1040" height="340" fill="#0a0e14" />

  <!-- Box A: Feature Panel -->
  <rect x="20" y="125" width="170" height="90" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="105" y="162" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Feature Panel</text>
  <text x="105" y="186" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">recent-level lags, promo intensity, seasonality</text>

  <!-- Arrow A -> B -->
  <line x1="190" y1="150" x2="225" y2="88" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />
  <!-- Arrow A -> C -->
  <line x1="190" y1="190" x2="225" y2="252" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Box B: Direct LightGBM -->
  <rect x="225" y="35" width="180" height="90" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="315" y="72" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Direct LightGBM</text>
  <text x="315" y="96" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">5 seeds, per-horizon lag buckets &#183; ~70%</text>

  <!-- Box C: Recursive LightGBM -->
  <rect x="225" y="215" width="180" height="90" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="315" y="252" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Recursive LightGBM</text>
  <text x="315" y="276" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">per-family, feeds preds back &#183; ~30%</text>

  <!-- Arrow B -> D -->
  <line x1="405" y1="88" x2="430" y2="150" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />
  <!-- Arrow C -> D -->
  <line x1="405" y1="252" x2="430" y2="190" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Box D: Learned Blend -->
  <rect x="430" y="125" width="180" height="90" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="520" y="162" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Learned Blend</text>
  <text x="520" y="186" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">LOO-validated on 16-day windows</text>

  <!-- Arrow D -> E -->
  <line x1="610" y1="170" x2="650" y2="170" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Box E: Post-process -->
  <rect x="650" y="125" width="170" height="90" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="735" y="162" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Post-process</text>
  <text x="735" y="186" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">hard-zero series dormant 365+ days</text>

  <!-- Arrow E -> F -->
  <line x1="820" y1="170" x2="860" y2="170" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Box F: 16-day Forecast -->
  <rect x="860" y="125" width="160" height="90" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  <text x="940" y="162" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">16-day Forecast</text>
  <text x="940" y="186" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">1,782 store x family series</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22d3ee" />
    </marker>
  </defs>
</svg>
